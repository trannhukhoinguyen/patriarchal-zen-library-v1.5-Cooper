about.title=Chúng tôi là những <span class="text-primary">Nhà thám hiểm</span>
about.mission=Sứ mệnh của chúng tôi là tìm kiếm một ngôi nhà mới cho nhân loại giữa các vì sao, nhằm đảm bảo sự tồn vong của giống loài.
about.story.title=Sứ mệnh
about.story.p1=Mọi chuyện bắt đầu từ "Bệnh dịch" (The Blight). Thế giới không cần thêm kỹ sư; nó cần những người nông dân. Nhưng chúng tôi hiểu rằng, chỉ cúi nhìn xuống mặt đất thì chẳng thể tìm ra lời giải. Chúng tôi phải ngước nhìn lên trên.
about.story.p2=Các sứ mệnh Lazarus đã thắp lên hy vọng. Mười hai nhà thám hiểm được cử vào vùng đất chưa biết để tìm kiếm những thế giới có thể sinh sống được. Chúng tôi chế tạo tàu Endurance không chỉ để khám phá, mà còn để kiểm chứng xem liệu chúng ta có thể tồn tại hay không.
about.story.p3=Ngày nay, chúng ta đang đứng trước ngưỡng cửa của một chiều không gian mới. Chúng ta là những người gìn giữ tương lai, được dẫn lối bởi tình yêu vượt xa cả thời gian và không gian.
