about.timeline.title=Hành trình của chúng tôi
about.timeline.1.date=2067
about.timeline.1.title=Thảm họa mùa màng (The Blight)
about.timeline.1.desc=Mùa màng thất bát và các trận bão bụi đe dọa sự tồn vong của nhân loại trên Trái Đất.
about.timeline.2.date=2069
about.timeline.2.title=Các sứ mệnh Lazarus
about.timeline.2.desc=NASA bí mật cử 12 phi hành gia dũng cảm đi qua lỗ sâu (wormhole) để tìm kiếm một ngôi nhà mới.
about.timeline.3.date=2087
about.timeline.3.title=Phóng tàu Endurance
about.timeline.3.desc=Cooper và Brand rời Trái Đất, lần theo các dấu vết để cứu lấy nhân loại.
about.timeline.4.date=2156
about.timeline.4.title=Trạm Cooper (Cooper Station)
about.timeline.4.desc=Nhân loại phát triển mạnh mẽ trên các cấu trúc O'Neill gần sao Thổ. Cooper trở về.

benefits.title=Tại sao các nhà phát triển chọn Cooper
benefits.subtitle=Được xây dựng vì hiệu suất, khả năng mở rộng và trải nghiệm của nhà phát triển.
benefits.1.title=Không cần cấu hình (Zero Config)
benefits.1.desc=Mọi thứ đều đã được cấu hình sẵn. Chỉ cần sao chép (clone), chỉnh sửa và bắt đầu lập trình.
benefits.2.title=An toàn kiểu dữ liệu (Type Safe)
benefits.2.desc=Đảm bảo an toàn kiểu dữ liệu xuyên suốt với TypeScript và Astro Content Collections.
benefits.3.title=Tối ưu hóa SEO
benefits.3.desc=Cải thiện thứ hạng tìm kiếm nhờ sơ đồ trang web (sitemap), thẻ meta và dữ liệu có cấu trúc tự động.
benefits.4.title=Chế độ tối (Dark Mode)
benefits.4.desc=Hỗ trợ chế độ tối đẹp mắt ngay từ đầu, không gây hiện tượng nhấp nháy giao diện.
benefits.5.title=Khả năng truy cập (Accessible)
benefits.5.desc=Thiết kế hòa nhập, tuân thủ các tiêu chuẩn tốt nhất theo hướng dẫn WCAG.
benefits.6.title=Quy mô toàn cầu
benefits.6.desc=Triển khai tức thì lên mạng lưới biên (edge) thông qua Cloudflare, Vercel hoặc Netlify.

