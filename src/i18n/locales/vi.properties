about.feat.fast=Tốc độ cực nhanh
about.feat.fast.desc=Được tối ưu hóa cho tốc độ với cơ chế không sử dụng JavaScript (zero-js) theo mặc định và kiến ​​trúc "island" (kiến trúc phân mảnh).
about.feat.secure=Bảo mật ngay từ thiết kế
about.feat.secure.desc=Được xây dựng dựa trên các phương pháp tối ưu và tiêu chuẩn bảo mật hiện đại.
about.feat.responsive=Tương thích mọi thiết bị
about.feat.responsive.desc=Hiển thị hoàn hảo trên mọi thiết bị, từ điện thoại di động đến màn hình máy tính 4K.
about.feat.seo=Tối ưu hóa SEO
about.feat.seo.desc=Hỗ trợ sẵn sơ đồ trang web (sitemap), thẻ meta và Open Graph.
about.feat.dev=Thân thiện với nhà phát triển
about.feat.dev.desc=Sử dụng TypeScript, Tailwind cùng các công cụ được cấu hình sẵn để mang lại trải nghiệm phát triển tuyệt vời.
about.feat.comp=Dựa trên thành phần (Component-based)
about.feat.comp.desc=Kiến trúc mô-đun sử dụng các thành phần (component) của React và Astro.
contact.title=Kết nối với <span class="text-primary">chúng tôi</span>
contact.desc=Chúng tôi rất mong nhận được phản hồi từ bạn. Hãy điền vào biểu mẫu bên dưới hoặc liên hệ trực tiếp với chúng tôi.
