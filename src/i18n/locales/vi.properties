faq.default.title=Các câu hỏi thường gặp
faq.default.subtitle=Mọi thông tin bạn cần biết về sản phẩm và thanh toán.
faq.home.1.q=Bộ khung này có miễn phí sử dụng không?
faq.home.1.a=Có! Mẫu cơ bản là mã nguồn mở và miễn phí sử dụng cho cả dự án cá nhân lẫn thương mại. Chúng tôi cũng cung cấp phiên bản Pro với các tính năng nâng cao và dịch vụ hỗ trợ chuyên biệt.
faq.home.2.q=Tôi có cần biết React không?
faq.home.2.a=Mặc dù chúng tôi sử dụng React cho các thành phần tương tác (interactive islands), bạn hoàn toàn có thể sử dụng bất kỳ framework nào mình thích (như Vue, Svelte, Solid) hoặc chỉ cần dùng JavaScript thuần (vanilla JS). Astro được thiết kế để không phụ thuộc vào bất kỳ framework cụ thể nào.
faq.home.3.q=Tính năng tìm kiếm hoạt động như thế nào?
faq.home.3.a=Chúng tôi sử dụng Fuse.js, một thư viện tìm kiếm linh hoạt (fuzzy search) gọn nhẹ. Thư viện này mang lại kết quả tìm kiếm tức thì, có khả năng xử lý các lỗi đánh máy mà không cần đến máy chủ bên ngoài hay khóa API (API key).
faq.home.4.q=Tôi có thể triển khai dự án này lên Vercel/Netlify không?
faq.home.4.a=Hoàn toàn có thể. Mẫu này đã được cấu hình sẵn các bộ chuyển đổi (adapter) cho Vercel, Netlify và Cloudflare Pages. Bạn chỉ cần đẩy mã nguồn lên GitHub và kết nối kho lưu trữ (repository) của mình.
faq.home.5.q=Điều gì tạo nên sự 'cao cấp' (premium) cho sản phẩm này?
faq.home.5.a=Ngoài thiết kế vượt trội, chúng tôi còn tích hợp sẵn các cấu hình chuẩn chuyên nghiệp (production-grade) bao gồm: SEO, phân tích dữ liệu (analytics), sơ đồ trang web (sitemap), nguồn cấp RSS, hình ảnh Open Graph, chế độ tối (dark mode) và khả năng truy cập (accessibility).
faq.pricing.1.q=Tôi có thể thay đổi gói dịch vụ sau này không?
faq.pricing.1.a=Có, bạn có thể nâng cấp hoặc hạ cấp gói dịch vụ bất cứ lúc nào. Chi phí sẽ được tính toán dựa trên thời gian sử dụng thực tế.
faq.pricing.2.q=Có bản dùng thử miễn phí không?
faq.pricing.2.a=Chúng tôi cung cấp bản dùng thử miễn phí 14 ngày cho gói Pro để bạn có thể trải nghiệm tất cả các tính năng.
faq.pricing.3.q=Các phương thức thanh toán nào được chấp nhận?
faq.pricing.3.a=Chúng tôi chấp nhận tất cả các loại thẻ tín dụng phổ biến, PayPal và chuyển khoản ngân hàng (đối với gói Enterprise).
faq.pricing.4.q=Các bạn có chính sách hoàn tiền không? faq.pricing.4.a=Có, chúng tôi cam kết hoàn tiền trong vòng 30 ngày nếu bạn không hài lòng.
cta.readyToLaunch=Sẵn sàng <br /><span class="text-primary">ra mắt?</span>
cta.description=Đừng lãng phí thời gian vào việc cấu hình. Hãy bắt đầu xây dựng dự án mơ ước của bạn ngay hôm nay với bộ khung (boilerplate) Astro tối ưu nhất.
