contact.email=Email
contact.phone=Điện thoại
contact.office=Văn phòng
contact.enterprise.title=Hỗ trợ doanh nghiệp
contact.enterprise.desc=Bạn cần một giải pháp tùy chỉnh hoặc sự hỗ trợ chuyên biệt? Đội ngũ doanh nghiệp của chúng tôi luôn sẵn sàng giúp đỡ.
contact.enterprise.btn=Liên hệ bộ phận kinh doanh
features.hero.title=Được thiết kế để đạt đến sự xuất sắc
features.hero.desc=Khám phá các tính năng mạnh mẽ và lựa chọn kiến ​​trúc hiện đại giúp Cooper trở thành bộ khung (boilerplate) Astro tiên tiến nhất trên thị trường.
features.search=Tìm kiếm toàn diện
features.search.desc=Tích hợp bảng lệnh (Command Palette - Cmd+K) vận hành bởi Fuse.js. Tìm kiếm siêu nhanh, thực hiện tại phía máy khách (client-side) và có khả năng chịu lỗi chính tả trên toàn bộ nội dung.
features.blog=Hệ thống Blog nâng cao
features.blog.desc=Blog đầy đủ tính năng với phân trang, nguồn cấp RSS, ước tính thời gian đọc, thẻ (tags) và hình ảnh tiêu đề (hero images) được tối ưu hóa.
features.seo=SEO cao cấp
features.seo.desc=Tự động tạo sơ đồ trang web (sitemap), thiết lập URL chuẩn (canonical URLs) và dữ liệu có cấu trúc (JSON-LD) cho Tổ chức, Sản phẩm và Bài viết.
features.zerojs=Mặc định không sử dụng JavaScript (Zero-JS)
features.zerojs.desc=Kiến trúc "Island Architecture" của Astro chỉ nạp JavaScript cho các thành phần cần tương tác, đảm bảo đạt điểm hiệu năng 100/100 trên Lighthouse.
features.images=Tối ưu hóa hình ảnh

features.images.desc=Tự động chuyển đổi sang định dạng WebP/AVIF và điều chỉnh kích thước linh hoạt (responsive) cho mọi tài nguyên thông qua hệ thống xử lý hình ảnh tích hợp sẵn của Astro.
features.security=Bảo mật cấp doanh nghiệp
features.security.desc=Cấu hình sẵn các tiêu đề bảo mật (security headers), chính sách bảo mật nội dung (CSP) và cơ chế đồng ý sử dụng cookie tuân thủ các quy định về quyền riêng tư, với dữ liệu được lưu trữ cục bộ.
features.i18n=Sẵn sàng cho quốc tế hóa (i18n)
features.i18n.desc=Cấu trúc thư mục và logic định tuyến có khả năng mở rộng, được thiết kế để hỗ trợ quốc tế hóa (internationalization) và bản địa hóa (localization) một cách mượt mà.
features.a11y=Ưu tiên khả năng truy cập (Accessibility)
features.a11y.desc=Được kiểm định để tuân thủ tiêu chuẩn WCAG, bao gồm việc sử dụng các nhãn ARIA phù hợp, HTML ngữ nghĩa và hỗ trợ chế độ tối (dark mode) với độ tương phản cao.
features.stack=Công nghệ hiện đại
features.stack.desc=Tận dụng sức mạnh của Astro 7, Tailwind CSS 4 và React 19 để mang đến trải nghiệm phát triển tiên tiến nhất.
features.controls=Kiểm soát chi tiết
features.controls.desc=Quản lý các tính năng như Tìm kiếm (Search) và Phân trang (Pagination) trực tiếp từ tệp `site.config.ts`. Cho phép bật hoặc tắt các mô-đun một cách nhanh chóng.
features.types=Nội dung an toàn kiểu dữ liệu (Type-safe)
features.types.desc=Sử dụng tính năng Content Collections của Astro để đảm bảo kiểm tra kiểu dữ liệu nghiêm ngặt cho các tệp Blog, Tài liệu (Docs) và Nhật ký thay đổi (Changelog).
features.rss=RSS tự động
features.rss.desc=Cho phép người dùng đăng ký theo dõi các cập nhật mới nhất thông qua các nguồn cấp RSS (RSS feeds) được tự động tạo cho cả Blog và Nhật ký thay đổi (Changelog).
features.dev.title=Được thiết kế cho các nhà phát triển hiện đại
features.dev.1=Hỗ trợ nguyên bản cho Content Collections của Astro 6+
