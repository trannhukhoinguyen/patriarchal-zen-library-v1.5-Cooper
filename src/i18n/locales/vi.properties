cta.disclaimer=Không yêu cầu thẻ tín dụng đối với phiên bản mã nguồn mở. Dùng thử miễn phí 14 ngày cho phiên bản Pro.
bento.title=Mọi thứ bạn cần để <span class="text-primary">ra mắt nhanh hơn</span>
bento.description=Đừng lãng phí thời gian vào việc cấu hình. Chúng tôi đã xử lý những công việc tẻ nhạt để bạn có thể tập trung vào việc xây dựng sản phẩm.
bento.item1.title=Mạng lưới Edge toàn cầu
bento.item1.desc=Triển khai ứng dụng của bạn tới hơn 35 khu vực trên toàn thế giới chỉ với một cú nhấp chuột. Độ trễ thấp, tính sẵn sàng cao.
bento.item2.title=Mã nguồn sạch (Clean Code)
bento.item2.desc=Được xây dựng theo các tiêu chuẩn hiện đại. Đảm bảo kiểu dữ liệu (type-safe), đã được kiểm tra lỗi (linted) và định dạng sẵn sàng để sử dụng.
bento.item3.title=Tốc độ cực nhanh
bento.item3.desc=Mặc định không sử dụng JavaScript (Zero JS), mang lại hiệu suất vượt trội.
bento.item4.title=Bảo mật
bento.item4.desc=Tích hợp sẵn các tiêu chuẩn và phương pháp bảo mật tốt nhất hiện nay.
bento.item5.title=Bảng điều khiển phân tích
bento.item5.desc=Nắm bắt thông tin về lưu lượng truy cập với công cụ phân tích ưu tiên quyền riêng tư.
