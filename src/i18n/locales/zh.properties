faq.default.title=常见问题解答
faq.default.subtitle=关于产品与计费，您需要了解的一切。
faq.home.1.q=这个样板项目可以免费使用吗？
faq.home.1.a=是的！该核心模板为开源项目，可免费用于个人及商业项目。我们另提供包含高级功能与专属技术支持的“专业版”（Pro）。
faq.home.2.q=我需要掌握 React 吗？
faq.home.2.a=虽然我们使用 React 来构建交互式组件（Interactive Islands），但你完全可以使用自己偏好的任何框架（如 Vue、Svelte、Solid），甚至直接使用原生 JavaScript。Astro 在设计上不绑定任何特定框架。
faq.home.3.q=搜索功能是如何实现的？
faq.home.3.a=我们使用了轻量级的模糊搜索库 Fuse.js。它无需外部服务器或 API 密钥，即可提供即时且具备容错能力的搜索结果。
faq.home.4.q=我可以将其部署到 Vercel 或 Netlify 吗？
faq.home.4.a=当然可以。该模板已预先配置了适用于 Vercel、Netlify 和 Cloudflare Pages 的适配器。只需将其推送到 GitHub 并关联你的代码仓库即可。
faq.home.5.q=为什么说它是“高级版”（Premium）？
faq.home.5.a=除了精美的设计外，它还开箱即用地提供了生产级配置，涵盖 SEO、数据分析、站点地图（Sitemap）、RSS 订阅源、Open Graph 预览图、深色模式以及无障碍支持。
faq.pricing.1.q=以后可以更改套餐吗？
faq.pricing.1.a=可以，你随时都能升级或降级套餐。费用将按比例进行调整。
faq.pricing.2.q=提供免费试用吗？
faq.pricing.2.a=我们为“专业版”（Pro）套餐提供 14 天免费试用，让你能够充分体验各项功能。
faq.pricing.3.q=支持哪些支付方式？
faq.pricing.3.a=我们支持各类主流信用卡和 PayPal；企业用户还可通过银行转账进行支付。
faq.pricing.4.q=提供退款吗？ faq.pricing.4.a=是的，如果您不满意，我们提供 30 天退款保证。
