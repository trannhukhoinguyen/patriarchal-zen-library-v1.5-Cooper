features.hero.title=卓越工程设计
features.hero.desc=探索 Cooper 所具备的强大功能与现代架构选择，使其成为市场上最先进的 Astro 样板项目（Boilerplate）。
features.search=全局搜索
features.search.desc=内置基于 Fuse.js 的命令面板（快捷键：Cmd+K）。针对所有内容的超高速、客户端搜索，支持容错（模糊匹配）。

features.blog=高级博客系统
features.blog.desc=功能完备的博客，支持分页、RSS 订阅、阅读时长预估、标签以及经过优化的首屏大图（Hero Images）。
features.seo=优质 SEO
features.seo.desc=自动生成站点地图（Sitemap）、规范链接（Canonical URLs），并提供针对组织、产品和文章的结构化数据（JSON-LD）。
features.zerojs=默认零 JS（Zero-JS）
features.zerojs.desc=利用 Astro 的“孤岛架构”（Island Architecture），仅对交互式组件进行“激活”（Hydration），确保 Lighthouse 性能评分达到 100/100。
features.images=图像优化

features.images.desc=利用 Astro 原生图像处理管线，自动将资源转换为 WebP/AVIF 格式，并根据响应式需求调整尺寸。
features.security=企业级安全保障
features.security.desc=内置预配置的安全响应头（Security Headers）、内容安全策略（CSP），以及符合隐私合规要求的 Cookie 同意机制（支持本地存储持久化）。
features.i18n=国际化（i18n）就绪
features.i18n.desc=采用可扩展的目录结构与路由逻辑，助力实现无缝的国际化（i18n）与本地化（l10n）。
features.a11y=无障碍优先
features.a11y.desc=符合 WCAG 标准，配备完善的 ARIA 标签与语义化 HTML，并支持高对比度深色模式。
features.stack=现代技术栈
features.stack.desc=集成 Astro 7、Tailwind CSS 4 和 React 19，为您带来前沿的开发体验。
features.controls=精细化控制
features.controls.desc=通过 `site.config.ts` 即可直接管理搜索、分页等功能，支持随时开启或关闭相关模块。
features.types=类型安全的内容管理
features.types.desc=借助 Astro 的“内容集合”（Content Collections）功能，对博客、文档及更新日志（Changelog）文件进行严格的类型校验。
features.rss=自动化 RSS
features.rss.desc=自动生成博客与更新日志的 RSS 订阅源，方便用户随时获取您的最新动态.
features.dev.title=专为现代开发者设计
features.dev.1=原生支持 Astro 6+ 内容集合 (Content Collections)
features.dev.2=集成 Tailwind CSS 4，支持 Vite 零配置
features.dev.3=预配置 ESLint、Prettier 和 TypeScript
features.dev.4=针对 Vercel、Netlify 和 Cloudflare Pages 进行优化
