about.feat.fast=极速性能
about.feat.fast.desc=针对速度进行了深度优化，默认采用“零 JS”（Zero-JS）策略及“孤岛架构”（Island Architecture）。
about.feat.secure=原生安全
about.feat.secure.desc=遵循最佳实践与现代安全标准构建。
about.feat.responsive=全响应式设计
about.feat.responsive.desc=在任何设备上均能呈现完美视觉效果，从手机到 4K 桌面显示器，适配无忧。
about.feat.seo=SEO 优化
about.feat.seo.desc=内置站点地图（Sitemap）、元标签（Meta Tags）及 Open Graph 支持，开箱即用。
about.feat.dev=开发者友好
about.feat.dev.desc=集成 TypeScript、Tailwind 及完善的工具链配置，带来卓越的开发体验（DX）。
about.feat.comp=组件化架构
about.feat.comp.desc=采用模块化架构，基于 React 和 Astro 组件构建。
