about.title=我们是<span class="text-primary">探索者</span>
about.mission=我们的使命是在群星之中为人类寻找一个新家园，确保我们物种的延续。
about.story.title=使命
about.story.p1=一切始于“枯萎病”（The Blight）。世界不再需要更多的工程师，而是需要农民。但我们深知，盯着脚下的泥土并非解决之道。我们必须仰望星空。
about.story.p2=“拉撒路”（Lazarus）任务为我们带来了希望。十二名探险者被派往未知领域，寻找适宜人类居住的世界。我们建造“永恒号”（Endurance），不仅是为了探索，更是为了验证人类是否能够生存下去。
about.story.p3=如今，我们正站在通往新维度的边缘。我们是未来的守护者，而驱动我们的，是那份超越时空的爱。
